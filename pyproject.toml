[tool.poetry]
name = "tolkien-rag"
version = "0.1.0"
description = "Rag"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
unsloth = "*"
torch = "*"
transformers = ">=4.51.0"
trl = ">=0.15.0"
datasets = ">=3.0.0"
beautifulsoup4 = ">=4.12.0"
lxml = ">=5.0.0"
ipykernel = ">=6.0.0"
jupyter = ">=1.0.0"
qdrant-client = ">=1.17.1"
langchain-text-splitters = ">=0.3.0"
sentence-transformers = ">=3.0.0"
rank-bm25 = ">=0.2.2"
python-dotenv = ">=1.0.0"
requests = ">=2.31.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry-core.masonry.api"
